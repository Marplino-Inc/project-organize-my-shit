[project]
name = "project-organize-my-shit"
version = "0.1.0"
description = "A colorful, local project workspace with cards, goals, and relationship maps."
requires-python = ">=3.12,<3.14"
dependencies = ["nicegui>=3.17.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
